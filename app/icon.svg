<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sritama Basu">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A" />
      <stop offset="0.45" stop-color="#D4AF37" />
      <stop offset="1" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- dark disc backing -->
  <circle cx="32" cy="32" r="32" fill="#0C0A09" />

  <!-- gold brand ring -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#gold)" stroke-width="4" />

  <!-- vinyl record -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#gold)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="9" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.65" />
  <circle cx="32" cy="32" r="3.2" fill="#D4AF37" />
  <circle cx="32" cy="32" r="1.3" fill="#0C0A09" />

  <!-- spinning-disc highlights -->
  <path d="M19.5 17.5 A 20 20 0 0 1 44.5 16.5" fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
  <path d="M45 46.5 A 20 20 0 0 1 20 47.5" fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
</svg>
